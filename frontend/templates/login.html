{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDUflow | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .login-container {
        background: white;
        border-radius: 24px;
        padding: 48px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
      }
      
      .login-header {
        text-align: center;
        margin-bottom: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      .login-icon {
        width: auto;
        max-width: 360px;
        height: auto;
        max-height: 200px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-icon img {
        width: 100%;
        height: auto;
        max-height: 200px;
        object-fit: contain;
      }
      
      .login-title {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a1a;
        margin: 0 0 8px 0;
      }
      
      .login-subtitle {
        font-size: 16px;
        color: #666;
        margin: 0;
      }
      
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      
      .form-group label {
        font-size: 14px;
        font-weight: 500;
        color: #333;
      }
      
      .form-group input {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 16px;
        font-family: inherit;
        transition: all 0.2s;
      }
      
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      
      .login-button {
        padding: 14px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      
      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }
      
      .login-button:active {
        transform: translateY(0);
      }
      
      .error-message {
        background: #fee;
        color: #c33;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        display: none;
      }
      
      .error-message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon"><img src="{% static 'img/eduflow-8.png' %}" alt="EDUflow Logo"></div>
        <h1 class="login-title">Faça login para continuar</h1>
        
      </div>
      
      <div id="errorMessage" class="error-message"></div>
      
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
            placeholder="Digite seu usuário"
          />
        </div>
        
        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
          />
        </div>
        
        <button type="submit" class="login-button">Entrar</button>
      </form>
    </div>

    <script>
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }

      const form = document.getElementById("loginForm");
      const errorMessage = document.getElementById("errorMessage");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        
        errorMessage.classList.remove("show");
        errorMessage.textContent = "";

        try {
          const csrf = getCookie("csrftoken");
          const response = await fetch("/api/auth/login/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrf || "",
            },
            credentials: "same-origin",
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            console.log("Login bem-sucedido, redirecionando...");
            // Aguarda um pouco para garantir que a sessão foi estabelecida
            await new Promise(resolve => setTimeout(resolve, 200));
            // Redireciona para o dashboard (visão geral), não para o calendário
            window.location.replace("/dashboard/");
          } else {
            errorMessage.textContent = data.error || "Erro ao fazer login";
            errorMessage.classList.add("show");
          }
        } catch (error) {
          errorMessage.textContent = "Erro de conexão. Tente novamente.";
          errorMessage.classList.add("show");
        }
      });

      // Foca no campo de usuário ao carregar
      document.getElementById("username").focus();
    </script>
  </body>
</html>
